<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Oriental v3.0 - Project Management</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Oriental">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets - All CSS is external -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- App Loader -->
    <div class="app-loader" id="app-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Loading Oriental...</div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard">
        <!-- Sidebar Overlay (Mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    <span>Oriental</span>
                </div>
            </div>

            <div class="user-info">
                <div class="user-avatar" id="user-avatar-initial">?</div>
                <div class="user-details">
                    <div class="user-name" id="user-name">Loading...</div>
                    <div class="user-email" id="user-email"></div>
                </div>
                <button class="btn-icon theme-toggle" title="Toggle theme">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>

            <div class="org-info">
                <span class="org-name" id="org-name">Loading...</span>
                <span class="org-role" id="org-role">Member</span>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-view="board">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/>
                    </svg>
                    <span>Board</span>
                </a>
                <a href="#" class="nav-item" data-view="sprints">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>Sprints</span>
                </a>
                <a href="#" class="nav-item" data-view="reports">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
                    </svg>
                    <span>Reports</span>
                </a>
                <a href="#" class="nav-item" data-view="settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="projects-section">
                <div class="projects-header">
                    <h3>Projects</h3>
                    <button class="btn-icon" id="add-project-btn" title="Add Project">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                </div>
                <div id="project-list">
                    <div class="project-item placeholder">
                        <span class="project-color" style="background:#d1d5db;"></span>
                        <span class="project-name">Loading projects...</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="btn-secondary logout-btn" id="logout-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Mobile Header -->
            <div class="mobile-header" id="mobile-header">
                <button class="btn-icon" id="mobile-menu-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="mobile-logo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
                    </svg>
                    <span>Oriental</span>
                </div>
                <button class="btn-icon theme-toggle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>

            <!-- Desktop Header -->
            <div class="dashboard-header">
                <div class="header-left">
                    <h1 id="current-view">Board</h1>
                    <span id="current-project-name"></span>
                </div>
                <div class="header-actions">
                    <div class="search-container">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" id="search-tasks" placeholder="Search tasks..." class="search-input" autocomplete="off">
                    </div>
                    <button class="btn-secondary" id="filter-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                        </svg>
                        Filter
                    </button>
                    <button class="btn-primary" id="create-task-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        New Task
                    </button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Admin Overview View -->
                <div class="view-container active" id="admin-view"></div>

                <!-- Board View -->
                <div class="view-container" id="board-view">
                    <div id="board-content">
                        <div class="board-loading">
                            <div class="loader-spinner"></div>
                            <p>Loading board...</p>
                        </div>
                    </div>
                </div>

                <!-- Sprints View -->
                <div class="view-container" id="sprints-view">
                    <div class="sprint-header">
                        <div class="sprint-info">
                            <h3 id="active-sprint-name">No Active Sprint</h3>
                            <p id="active-sprint-goal">Start a sprint to track progress</p>
                            <div class="sprint-dates" id="sprint-dates"></div>
                        </div>
                        <div class="sprint-actions">
                            <button class="btn-primary" id="create-sprint-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                                Start Sprint
                            </button>
                            <button class="btn-success" id="complete-sprint-btn" style="display:none;">
                                Complete Sprint
                            </button>
                        </div>
                    </div>
                    <div class="sprint-progress">
                        <div class="progress-header">
                            <span>Progress</span>
                            <span id="sprint-progress-percent">0%</span>
                        </div>
                        <div class="progress-bar large">
                            <div class="progress-fill" id="sprint-progress-fill" style="width:0%;"></div>
                        </div>
                        <div class="progress-stats">
                            <span id="sprint-completed-tasks">0</span> / <span id="sprint-total-tasks">0</span> tasks completed
                        </div>
                    </div>
                    <div id="sprint-board-content"></div>
                    <div class="past-sprints">
                        <h4>Past Sprints</h4>
                        <div id="past-sprints-list"></div>
                    </div>
                </div>

                <!-- Reports View -->
                <div class="view-container" id="reports-view"></div>

                <!-- Settings View -->
                <div class="view-container" id="settings-view"></div>
            </div>
        </main>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <div class="bottom-nav" id="bottom-nav">
        <button class="bottom-nav-item active" data-view="board">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/>
            </svg>
            <span>Board</span>
        </button>
        <button class="bottom-nav-item" data-view="sprints">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
            </svg>
            <span>Sprints</span>
        </button>
        <button class="bottom-nav-item" data-view="reports">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
            </svg>
            <span>Reports</span>
        </button>
        <button class="bottom-nav-item" data-view="settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>Settings</span>
        </button>
        <button class="bottom-nav-item" id="bottom-add-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span>New Task</span>
        </button>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS (in correct dependency order)        -->
    <!-- ============================================ -->
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>
    
    <!-- Core Libraries -->
    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/auth-offline.js"></script>
    <script src="js/network.js"></script>
    
    <!-- Auth & Roles -->
    <script src="js/auth.js"></script>
    <script src="js/roles.js"></script>
    
    <!-- Feature Modules -->
    <script src="js/seed.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/board.js"></script>
    <script src="js/milestones.js"></script>
    <script src="js/teams.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/admin.js"></script>
    
    <!-- Main Application -->
    <script src="js/app.js"></script>
    
    <!-- Console Testing Commands -->
    <script src="tests/console-commands.js"></script>
    
    <!-- PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('✅ Service Worker registered'))
                .catch(err => console.log('Service Worker:', err.message));
        }
    </script>
</body>
</html>
